<!-- Extra Mind Time - v8 “Mind Gate calm blue - clean pause” -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Extra Mind Time refined logo">
  <defs>
    <!-- Fondo azul-gris calmado -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1B25"/>
      <stop offset="100%" stop-color="#283145"/>
    </linearGradient>

    <!-- Glow calmado -->
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EB8FF"/>
      <stop offset="100%" stop-color="#527BFF"/>
    </linearGradient>

    <!-- Sombra más ligera -->
    <filter id="drop" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g transform="translate(256,256)">
    <!-- Portal -->
    <g>
      <path d="M-110,80 v-92 a110,110 0 0 1 220,0 v92 a20,20 0 0 1 -20,20 h-180 a20,20 0 0 1 -20,-20 z"
            fill="none" stroke="#E5E9F0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

      <path d="M-90,64 v-72 a90,90 0 0 1 180,0 v72 a10,10 0 0 1 -10,10 h-140 a10,10 0 0 1 -10,-10 z"
            fill="#1A1B25" opacity="0.95"/>

      <rect x="-5" y="-72" width="10" height="144" rx="5" fill="#232635" opacity="0.6"/>
    </g>

    <!-- Badge -->
    <g filter="url(#drop)">
      <circle cx="0" cy="10" r="48" fill="url(#glow)"/>

      <!-- Barras de pausa limpias -->
      <rect x="-10" y="-8" width="8" height="36" rx="2.5" fill="#F4F7FB" opacity="0.9"/>
      <rect x="2" y="-8" width="8" height="36" rx="2.5" fill="#F4F7FB" opacity="0.9"/>

      <!-- Halo exterior -->
      <circle cx="0" cy="10" r="52" fill="none" stroke="url(#glow)" stroke-opacity="0.25" stroke-width="3"/>
      <ellipse cx="0" cy="64" rx="32" ry="9" fill="#000" opacity="0.1"/>
    </g>

    <!-- Aros de tiempo -->
    <g opacity="0.07" stroke="#9AC0FF" stroke-width="3" fill="none">
      <circle cx="0" cy="10" r="80"/>
      <circle cx="0" cy="10" r="116"/>
    </g>
  </g>
</svg>
